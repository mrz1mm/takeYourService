<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout('Accedi', ~{::section})}"
>
  <body>
    <section>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
              <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">
                  <i class="fas fa-sign-in-alt me-2"></i>Accedi
                </h4>
              </div>
              <div class="card-body p-4">
                <!-- Messaggi -->
                <div class="alert alert-danger mb-4" th:if="${error}">
                  <i class="fas fa-exclamation-circle me-2"></i>
                  <span th:text="${error}"
                    >Nome utente o password non validi.</span
                  >
                </div>
                <div class="alert alert-success mb-4" th:if="${message}">
                  <i class="fas fa-check-circle me-2"></i>
                  <span th:text="${message}"
                    >Operazione completata con successo.</span
                  >
                </div>
                <div class="alert alert-info mb-4" th:if="${success}">
                  <i class="fas fa-info-circle me-2"></i>
                  <span th:text="${message}"
                    >Registrazione completata con successo.</span
                  >
                </div>

                <!-- Form di login -->
                <form th:action="@{/login}" method="post">
                  <div class="mb-3">
                    <label for="username" class="form-label"
                      >Username o Email</label
                    >
                    <div class="input-group">
                      <span class="input-group-text">
                        <i class="fas fa-user"></i>
                      </span>
                      <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        required
                        autofocus
                      />
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                      <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                      </span>
                      <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required
                      />
                    </div>
                  </div>
                  <div class="mb-3 form-check">
                    <input
                      type="checkbox"
                      id="remember-me"
                      name="remember-me"
                      class="form-check-input"
                    />
                    <label class="form-check-label" for="remember-me"
                      >Ricordami</label
                    >
                  </div>
                  <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-sign-in-alt me-2"></i>Accedi
                    </button>
                  </div>
                </form>
              </div>
              <div class="card-footer bg-light text-center py-3">
                <div>
                  Non hai un account?
                  <a th:href="@{/register}" class="text-decoration-none"
                    >Registrati</a
                  >
                </div>
                <div class="mt-2">
                  <a href="#" class="text-decoration-none"
                    >Password dimenticata?</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
